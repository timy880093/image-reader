{% extends "base.html" %}

{% block title %}{{ title or '漫畫閱讀器' }}{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/manga.css') }}">
<style>
    :root {
        --grid-columns-desktop: {{ ui_config.get('grid_columns_desktop', 3) }};
        --grid-columns-tablet: {{ ui_config.get('grid_columns_tablet', 2) }};
        --grid-columns-mobile: {{ ui_config.get('grid_columns_mobile', 1) }};
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="header">
        <h1>📚 {{ title or '本地漫畫閱讀器' }}</h1>
        <p>探索您的漫畫收藏</p>
        <div class="nav-menu">
            <a href="/manga" class="active">📚 漫畫</a>
            <a href="/gallery">🎨 Gallery</a>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋漫畫名稱...">
    </div>
    
    <div class="filter-bar">
        <button class="filter-btn active" data-status="all">全部</button>
        <button class="filter-btn" data-status="favorite">⭐ 收藏</button>
        <button class="filter-btn" data-status="reviewed">☑ 已審核</button>
        <button class="filter-btn" data-status="unreviewed">🆕 未審核</button>
    </div>

    <button id="favoriteOnlyBtn" class="favorite-only-fab" title="只顯示收藏章節">
        ☆
    </button>
    
    <div id="loading" class="loading">載入中...</div>
    <div id="errorMessage" class="error-message" style="display: none;"></div>
    <div id="mangaGrid" class="manga-grid"></div>
    <div id="noResults" class="no-results" style="display: none;">沒有找到匹配的漫畫</div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/manga/index.js') }}"></script>
{% endblock %}
